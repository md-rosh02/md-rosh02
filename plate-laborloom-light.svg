<svg width="600" height="230" viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F3EEFC"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glowFx" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="230" rx="10" fill="url(#bg)"/>
  <rect x="1" y="1" width="598" height="228" rx="9" fill="none" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1"/>
  <g filter="url(#glowFx)">
    <path d="M24,24 L24,42 M24,24 L42,24" stroke="#7C3AED" stroke-width="1.2" fill="none" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M576,206 L576,188 M576,206 L558,206" stroke="#7C3AED" stroke-width="1.2" fill="none" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="30" y="45" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#6E6E6E">PLATE I</text>
  <text x="570" y="45" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#7C3AED">VIEW &#8599;
    <animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <text x="30" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="url(#titleGrad)" filter="url(#glowFx)">LaborLoom</text>

  <text x="30" y="123" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#2E2E2E">Workforce platform connecting laborers &amp;</text>
  <text x="30" y="143" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#2E2E2E">contractors, rebuilt in monochrome with live alerts.</text>

  <line x1="30" y1="169" x2="570" y2="169" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1"/>

  <text x="30" y="192" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#6E6E6E">MEDIUM</text>
  <text x="30" y="211" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#7C3AED">React &#183; Express &#183; MongoDB &#183; WebSockets</text>
</svg>
