<svg width="1000" height="190" viewBox="0 0 1000 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowFx" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="190" rx="10" fill="#0A0A0A"/>
  <rect x="1" y="1" width="998" height="188" rx="9" fill="none" stroke="#22D3FF" stroke-opacity="0.35" stroke-width="1"/>

  <text x="40" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#22D3FF" filter="url(#glowFx)">FRONTEND<animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/></text>
  <text x="40" y="70" font-family="Georgia, serif" font-size="15" fill="#C7C7C7">JavaScript &#183; TypeScript &#183; React &#183;</text>
  <text x="40" y="93" font-family="Georgia, serif" font-size="15" fill="#C7C7C7">Next.js &#183; Tailwind CSS</text>

  <line x1="360" y1="20" x2="360" y2="170" stroke="#22D3FF" stroke-opacity="0.25" stroke-width="1"><animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/></line>

  <text x="390" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#22D3FF" filter="url(#glowFx)">BACKEND &amp; AI<animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="1s" repeatCount="indefinite"/></text>
  <text x="390" y="70" font-family="Georgia, serif" font-size="15" fill="#C7C7C7">Node.js &#183; Express &#183; Python &#183;</text>
  <text x="390" y="93" font-family="Georgia, serif" font-size="15" fill="#C7C7C7">FastAPI &#183; MongoDB &#183; Redis &#183;</text>
  <text x="390" y="116" font-family="Georgia, serif" font-size="15" fill="#C7C7C7">OpenAI &#183; Gemini &#183; Groq</text>

  <line x1="710" y1="20" x2="710" y2="170" stroke="#22D3FF" stroke-opacity="0.25" stroke-width="1"><animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="4s" begin="2s" repeatCount="indefinite"/></line>

  <text x="740" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#22D3FF" filter="url(#glowFx)">TOOLING<animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="2s" repeatCount="indefinite"/></text>
  <text x="740" y="70" font-family="Georgia, serif" font-size="15" fill="#C7C7C7">Docker &#183; Firebase &#183; Git &#183;</text>
  <text x="740" y="93" font-family="Georgia, serif" font-size="15" fill="#C7C7C7">GitHub Actions &#183; Postman</text>
</svg>
