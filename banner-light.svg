<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="50%" stop-color="#F3EEFC"/>
      <stop offset="100%" stop-color="#FAFAF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28">
        <animate attributeName="stop-opacity" values="0.16;0.34;0.16" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glowFx" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1"/>

  <g filter="url(#glowFx)">
    <path d="M40,40 L40,60 M40,40 L60,40" stroke="#7C3AED" stroke-width="1.4" fill="none" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M960,40 L960,60 M960,40 L940,40" stroke="#7C3AED" stroke-width="1.4" fill="none" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M40,220 L40,200 M40,220 L60,220" stroke="#7C3AED" stroke-width="1.4" fill="none" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M960,220 L960,200 M960,220 L940,220" stroke="#7C3AED" stroke-width="1.4" fill="none" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="500" y="72" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#6E6E6E">FULL STACK DEVELOPER &#183; BENGALURU, INDIA</text>

  <text x="500" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="3" fill="url(#titleGrad)" filter="url(#glowFx)">MOHAMMED ROSHAN</text>

  <line x1="395" y1="163" x2="605" y2="163" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.6"/>

  <text x="500" y="192" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" letter-spacing="0.5" fill="#2E2E2E">MERN &#183; Python/FastAPI &#183; LLM-integrated systems</text>

  <rect x="405" y="210" width="190" height="27" rx="13.5" fill="none" stroke="#7C3AED" stroke-width="1" filter="url(#glowFx)"/>
  <circle cx="424" cy="223.5" r="4" fill="#7C3AED" filter="url(#glowFx)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="510" y="228" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="2.5" fill="#7C3AED">OPEN TO WORK</text>

  <g fill="#7C3AED">
    <circle cx="120" cy="95" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="865" cy="72" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="885" cy="185" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="180" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="45" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="150" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="140" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
