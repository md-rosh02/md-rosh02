<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0deg);opacity:0}8%{opacity:1}90%{opacity:.9}100%{transform:translate(-220px,520px) rotate(540deg);opacity:0}}
@keyframes fly{from{transform:translateX(-70px)}to{transform:translateX(990px)}}
@keyframes drift{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.petal{animation:fall 12s linear infinite} .bird{animation:fly 30s linear infinite} .mist{animation:drift 14s ease-in-out infinite}
.scarf{animation:sway 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 50%} .glow{animation:breathe 6s ease-in-out infinite} .pl{animation:pulse 1.6s ease-in-out infinite}

</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06050A"/><stop offset="0.5" stop-color="#190913"/><stop offset="0.8" stop-color="#4F0E1F"/><stop offset="1" stop-color="#A8162B"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A88"/><stop offset="1" stop-color="#D01630"/></linearGradient>
<linearGradient id="redg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3B4E"/><stop offset="1" stop-color="#C1121F"/></linearGradient>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#FF3B4E"/><stop offset="1" stop-color="#FF3B4E" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
