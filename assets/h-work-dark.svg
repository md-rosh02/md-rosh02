<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" fill="none">
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes sp{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.t1{animation:tw 3s ease-in-out infinite} .t2{animation:tw 4.6s ease-in-out infinite} .t3{animation:tw 6.2s ease-in-out infinite}
.sp{animation:sp 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sp2{animation:sp 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.bob{animation:bob 6s ease-in-out infinite}

</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060714"/><stop offset=".6" stop-color="#0F0C2B"/><stop offset="1" stop-color="#1E1040"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE6A3"/><stop offset=".5" stop-color="#FFB3D1"/><stop offset="1" stop-color="#B9AAFF"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#FFD97A" stop-opacity=".9"/><stop offset=".5" stop-color="#A99BFF" stop-opacity=".4"/><stop offset="1" stop-color="#A99BFF" stop-opacity="0"/></linearGradient></defs><g transform="translate(34,34)"><path d="M0.0,-20.0 L1.1,-2.8 L7.1,-7.1 L2.8,-1.1 L20.0,0.0 L2.8,1.1 L7.1,7.1 L1.1,2.8 L0.0,20.0 L-1.1,2.8 L-7.1,7.1 L-2.8,1.1 L-20.0,0.0 L-2.8,-1.1 L-7.1,-7.1 L-1.1,-2.8Z" fill="#FFD97A" opacity=".25" filter="url(#soft)"/><path d="M0.0,-17.0 L1.0,-2.4 L6.0,-6.0 L2.4,-1.0 L17.0,0.0 L2.4,1.0 L6.0,6.0 L1.0,2.4 L0.0,17.0 L-1.0,2.4 L-6.0,6.0 L-2.4,1.0 L-17.0,0.0 L-2.4,-1.0 L-6.0,-6.0 L-1.0,-2.4Z" fill="#FFD97A" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></path></g><text x="68" y="42" font-size="28" font-weight="800" fill="url(#tg)" letter-spacing="-.5">Selected Work</text><text class="m" x="70" y="62" font-size="12" fill="#9C9EC6" letter-spacing=".6">projects, charted like constellations</text><rect x="20" y="76" width="860" height="1.5" rx=".75" fill="url(#l)" opacity=".7"/><path class="sp2" d="M868,22 Q868,30 876,30 Q868,30 868,38 Q868,30 860,30 Q868,30 868,22Z" fill="#FF9EC7" opacity="0.9"/><path class="sp" d="M846,41 Q846,46 851,46 Q846,46 846,51 Q846,46 841,46 Q846,46 846,41Z" fill="#A99BFF" opacity="0.9"/></svg>