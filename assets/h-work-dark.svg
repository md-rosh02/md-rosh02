<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace} .d{font-family:Anton,Impact,'Arial Black','Segoe UI',sans-serif;font-style:italic;font-weight:900}
@keyframes ember{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-190px);opacity:0}}
@keyframes glt{0%,90%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(-5px,1px);opacity:.95}94%{transform:translate(5px,-1px);opacity:.95}96%{transform:translate(-2px,0);opacity:.95}98%{transform:translate(0,0);opacity:0}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes slash{0%{stroke-dashoffset:520;opacity:1}7%{stroke-dashoffset:0;opacity:1}26%{stroke-dashoffset:0;opacity:1}38%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ember{animation:ember 4s linear infinite}
.glt{animation:glt 5s steps(1) infinite}
.shake{animation:shake .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.slash{animation:slash 6s ease-out infinite}
.bob{animation:bob 4s ease-in-out infinite}
.sway{animation:sway 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
.pl{animation:pulse 1.2s ease-in-out infinite}
.pop{animation:pop 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

</style>
<defs><pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2.1" fill="#FF2A44" fill-opacity=".6"/></pattern>
<pattern id="hk" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2.1" fill="#000" fill-opacity=".45"/></pattern>
<linearGradient id="redg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2A44"/><stop offset="1" stop-color="#B3001B"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><text class="d" x="892" y="72" text-anchor="end" font-size="96" fill="none" stroke="#F5F2EC" stroke-opacity=".22" stroke-width="2">01</text><polygon points="16.0,8.0 120.0,8.0 112.0,32.0 8.0,32.0" fill="#FF2A44" stroke="#F5F2EC" stroke-width="2"/><text class="m" x="64.0" y="24.2" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="1">CHAPTER 01</text><text class="m" x="134" y="25" font-size="12" fill="#A3A3AF" font-weight="600">// projects i've shipped</text><text class="d" x="13" y="66" font-size="40" fill="#FF2A44">SELECTED WORK</text><text class="d" x="10" y="63" font-size="40" fill="#F5F2EC">SELECTED WORK</text><polygon points="6.0,74.0 640.0,74.0 628.0,80.0 2.0,80.0" fill="#FF2A44"/><polygon points="650.0,74.0 700.0,74.0 688.0,80.0 638.0,80.0" fill="#F5F2EC"/></svg>