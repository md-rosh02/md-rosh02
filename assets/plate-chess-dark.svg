<svg xmlns="http://www.w3.org/2000/svg" width="440" height="214" viewBox="0 0 440 214" fill="none">
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation:tw 4.4s ease-in-out infinite .8s;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}

</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B8A9FF"/><stop offset="1" stop-color="#FFB4A2"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="cp"><rect x="1" y="1" width="438" height="212" rx="20"/></clipPath></defs>
<rect x="1" y="1" width="438" height="212" rx="20" fill="#1A1B2B"/>
<g clip-path="url(#cp)"><circle cx="410" cy="10" r="70" fill="#B8A9FF" opacity="0.28" filter="url(#b)"/><rect x="1" y="1" width="438" height="4" fill="url(#g)"/></g>
<rect x="1" y="1" width="438" height="212" rx="20" stroke="#2B2D45" stroke-width="1.5"/>
<rect x="28" y="28" width="46" height="46" rx="14" fill="url(#g)"/>
