<text x="88" y="48" font-size="21" font-weight="800" fill="#EDEDF7" letter-spacing="-.3">Chess</text>
<text class="m" x="88" y="68" font-size="11.5" fill="#B8A9FF" font-weight="600">JAVASCRIPT · GAME</text>
