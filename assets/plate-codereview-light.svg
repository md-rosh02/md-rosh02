<svg xmlns="http://www.w3.org/2000/svg" width="440" height="188" viewBox="0 0 440 188" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(8deg)}}
.bob{animation:bob 5s ease-in-out infinite}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.st1{animation:steam 3s ease-in-out infinite} .st2{animation:steam 3s ease-in-out infinite .9s} .st3{animation:steam 3s ease-in-out infinite 1.8s}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fl{animation:floaty 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl2{animation:floaty 6.5s ease-in-out infinite 1s;transform-box:fill-box;transform-origin:center}

</style>
<defs><filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C5CFF"/><stop offset=".55" stop-color="#FF6F91"/><stop offset="1" stop-color="#FF9E5E"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0FA383"/><stop offset="1" stop-color="#7A67F5"/></linearGradient></defs><clipPath id="c0"><rect x="3" y="3" width="434" height="182" rx="26"/></clipPath><g clip-path="url(#c0)"><rect x="3" y="3" width="434" height="182" fill="#FFF9F4"/><circle cx="394" cy="21" r="109" fill="#AEEFDA" opacity="0.81" filter="url(#blur)"/><circle cx="25" cy="185" r="73" fill="#CBBFFF" opacity="0.45" filter="url(#blur)"/></g><rect x="3" y="3" width="434" height="182" rx="26" fill="#FFFFFF" fill-opacity="0.35"/><rect x="3.75" y="3.75" width="432.5" height="180.5" rx="25.25" stroke="#E8DAF6" stroke-opacity="1" stroke-width="1.5"/><rect x="26" y="24" width="52" height="52" rx="17" fill="url(#bg)"/><text class="m" x="52.0" y="55.5" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">CR</text><text x="92" y="48" font-size="22" font-weight="800" fill="#2A2447" letter-spacing="-.4">CodeReview AI</text><text class="m" x="93" y="68" font-size="11.5" font-weight="700" fill="#0FA383" letter-spacing=".8">PYTHON  ·  LLM</text><g transform="translate(396,44)"><circle r="16" fill="#0FA383" fill-opacity=".14" stroke="#0FA383" stroke-opacity=".55"/><path d="M-5.5 5.5 L5.5 -5.5 M-4.5 -5.5 H5.5 V4.5" stroke="#0FA383" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="104" font-size="14" fill="#2A2447" opacity=".92">AI-assisted code review that reads your</text><text x="28" y="126" font-size="14" fill="#2A2447" opacity=".92">diffs and returns clear feedback.</text><rect x="28" y="142" width="72" height="28" rx="14.0" fill="#0FA383" fill-opacity=".14" stroke="#0FA383" stroke-opacity=".5"/><text x="64.0" y="160.2" text-anchor="middle" font-size="12" fill="#2A2447" font-weight="600">Python</text><rect x="108" y="142" width="79" height="28" rx="14.0" fill="#0FA383" fill-opacity=".14" stroke="#0FA383" stroke-opacity=".5"/><text x="147.5" y="160.2" text-anchor="middle" font-size="12" fill="#2A2447" font-weight="600">FastAPI</text><rect x="195" y="142" width="87" height="28" rx="14.0" fill="#0FA383" fill-opacity=".14" stroke="#0FA383" stroke-opacity=".5"/><text x="238.5" y="160.2" text-anchor="middle" font-size="12" fill="#2A2447" font-weight="600">LLM APIs</text></svg>