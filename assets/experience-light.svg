<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(8deg)}}
.bob{animation:bob 5s ease-in-out infinite}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.st1{animation:steam 3s ease-in-out infinite} .st2{animation:steam 3s ease-in-out infinite .9s} .st3{animation:steam 3s ease-in-out infinite 1.8s}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fl{animation:floaty 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl2{animation:floaty 6.5s ease-in-out infinite 1s;transform-box:fill-box;transform-origin:center}

</style>
<defs><filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C5CFF"/><stop offset=".55" stop-color="#FF6F91"/><stop offset="1" stop-color="#FF9E5E"/></linearGradient></defs><clipPath id="c0"><rect x="0" y="0" width="292" height="262" rx="26"/></clipPath><g clip-path="url(#c0)"><rect x="0" y="0" width="292" height="262" fill="#FFF9F4"/><circle cx="263" cy="26" r="157" fill="#CBBFFF" opacity="0.81" filter="url(#blur)"/><circle cx="29" cy="262" r="105" fill="#FFD1B2" opacity="0.45" filter="url(#blur)"/></g><rect x="0" y="0" width="292" height="262" rx="26" fill="#FFFFFF" fill-opacity="0.35"/><rect x="0.75" y="0.75" width="290.5" height="260.5" rx="25.25" stroke="#E8DAF6" stroke-opacity="1" stroke-width="1.5"/><rect x="24" y="24" width="133" height="28" rx="14.0" fill="#7A67F5" fill-opacity=".14" stroke="#7A67F5" stroke-opacity=".5"/><text x="90.5" y="42.2" text-anchor="middle" font-size="11.5" fill="#2A2447" font-weight="600">01  INTERNSHIP</text><text x="24" y="84" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">Software Engineering</text><text x="24" y="108" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">&amp; AI Intern</text><text class="m" x="24" y="138" font-size="12" font-weight="700" fill="#7A67F5">Rooman Technologies</text><text class="m" x="24" y="156" font-size="12" font-weight="700" fill="#7A67F5">IBM Partnership</text><text x="24" y="182" font-size="13" fill="#6F6A8F">Backend and AI-focused engineering</text><text x="24" y="201" font-size="13" fill="#6F6A8F">work under the IBM partnership</text><text x="24" y="220" font-size="13" fill="#6F6A8F">program.</text><clipPath id="c1"><rect x="304" y="0" width="292" height="262" rx="26"/></clipPath><g clip-path="url(#c1)"><rect x="304" y="0" width="292" height="262" fill="#FFF9F4"/><circle cx="333" cy="26" r="157" fill="#FFBFCF" opacity="0.77" filter="url(#blur)"/><circle cx="567" cy="262" r="105" fill="#FFD1B2" opacity="0.54" filter="url(#blur)"/></g><rect x="304" y="0" width="292" height="262" rx="26" fill="#FFFFFF" fill-opacity="0.35"/><rect x="304.75" y="0.75" width="290.5" height="260.5" rx="25.25" stroke="#E8DAF6" stroke-opacity="1" stroke-width="1.5"/><rect x="328" y="24" width="133" height="28" rx="14.0" fill="#F5688B" fill-opacity=".14" stroke="#F5688B" stroke-opacity=".5"/><text x="394.5" y="42.2" text-anchor="middle" font-size="11.5" fill="#2A2447" font-weight="600">02  INTERNSHIP</text><text x="328" y="84" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">Web Development</text><text x="328" y="108" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">Intern</text><text class="m" x="328" y="138" font-size="12" font-weight="700" fill="#F5688B">Tech Fortune</text><text class="m" x="328" y="156" font-size="12" font-weight="700" fill="#F5688B">Technologies</text><text x="328" y="182" font-size="13" fill="#6F6A8F">Built and shipped web interfaces and</text><text x="328" y="201" font-size="13" fill="#6F6A8F">features in a team setting.</text><clipPath id="c2"><rect x="608" y="0" width="292" height="262" rx="26"/></clipPath><g clip-path="url(#c2)"><rect x="608" y="0" width="292" height="262" fill="#FFF9F4"/><circle cx="871" cy="236" r="157" fill="#AEEFDA" opacity="0.81" filter="url(#blur)"/><circle cx="637" cy="26" r="105" fill="#CBBFFF" opacity="0.45" filter="url(#blur)"/></g><rect x="608" y="0" width="292" height="262" rx="26" fill="#FFFFFF" fill-opacity="0.35"/><rect x="608.75" y="0.75" width="290.5" height="260.5" rx="25.25" stroke="#E8DAF6" stroke-opacity="1" stroke-width="1.5"/><rect x="632" y="24" width="126" height="28" rx="14.0" fill="#0FA383" fill-opacity=".14" stroke="#0FA383" stroke-opacity=".5"/><text x="695.0" y="42.2" text-anchor="middle" font-size="11.5" fill="#2A2447" font-weight="600">03  EDUCATION</text><text x="632" y="84" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">B.E. Computer Science</text><text x="632" y="108" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">&amp; Engineering</text><text class="m" x="632" y="138" font-size="12" font-weight="700" fill="#0FA383">Rural Engineering College</text><text class="m" x="632" y="156" font-size="12" font-weight="700" fill="#0FA383">Hulkoti, Gadag</text><text x="632" y="182" font-size="13" fill="#6F6A8F">Graduated 2025. 150+ DSA problems</text><text x="632" y="201" font-size="13" fill="#6F6A8F">solved on LeetCode and</text><text x="632" y="220" font-size="13" fill="#6F6A8F">GeeksforGeeks.</text><g transform="translate(298,131.0)"><circle r="12" fill="#FFF9F4" stroke="#7A67F5" stroke-opacity=".7" stroke-width="1.5"/><path d="M-3,-4 L3,0 L-3,4" stroke="#7A67F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(602,131.0)"><circle r="12" fill="#FFF9F4" stroke="#F5688B" stroke-opacity=".7" stroke-width="1.5"/><path d="M-3,-4 L3,0 L-3,4" stroke="#F5688B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>