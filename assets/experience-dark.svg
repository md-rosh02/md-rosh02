</g><rect x="304" y="0" width="292" height="262" rx="26" fill="#FFFFFF" fill-opacity="0.04"/><rect x="304.75" y="0.75" width="290.5" height="260.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1.5"/><rect x="328" y="24" width="133" height="28" rx="14.0" fill="#FF8FA3" fill-opacity=".14" stroke="#FF8FA3" stroke-opacity=".5"/><text x="394.5" y="42.2" text-anchor="middle" font-size="11.5" fill="#F5F3FF" font-weight="600">02  INTERNSHIP</text><text x="328" y="84" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">Web Development</text><text x="328" y="108" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">Intern</text><text class="m" x="328" y="138" font-size="12" font-weight="700" fill="#FF8FA3">Tech Fortune</text><text class="m" x="328" y="156" font-size="12" font-weight="700" fill="#FF8FA3">Technologies</text><text x="328" y="182" font-size="13" fill="#A9A7CC">Built and shipped web interfaces and</text><text x="328" y="201" font-size="13" fill="#A9A7CC">features in a team setting.</text><clipPath id="c2"><rect x="608" y="0" width="292" height="262" rx="26"/></clipPath><g clip-path="url(#c2)"><rect x="608" y="0" width="292" height="262" fill="#15162B"/><circle cx="871" cy="236" r="157" fill="#2FD3AE" opacity="0.45" filter="url(#blur)"/><circle cx="637" cy="26" r="105" fill="#7C6BFF" opacity="0.25" filter="url(#blur)"/></g><rect x="608" y="0" width="292" height="262" rx="26" fill="#FFFFFF" fill-opacity="0.04"/><rect x="608.75" y="0.75" width="290.5" height="260.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1.5"/><rect x="632" y="24" width="126" height="28" rx="14.0" fill="#4FE3C1" fill-opacity=".14" stroke="#4FE3C1" stroke-opacity=".5"/><text x="695.0" y="42.2" text-anchor="middle" font-size="11.5" fill="#F5F3FF" font-weight="600">03  EDUCATION</text><text x="632" y="84" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">B.E. Computer Science</text><text x="632" y="108" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">&amp; Engineering</text><text class="m" x="632" y="138" font-size="12" font-weight="700" fill="#4FE3C1">Rural Engineering College</text><text class="m" x="632" y="156" font-size="12" font-weight="700" fill="#4FE3C1">Hulkoti, Gadag</text><text x="632" y="182" font-size="13" fill="#A9A7CC">Graduated 2025. 150+ DSA problems</text><text x="632" y="201" font-size="13" fill="#A9A7CC">solved on LeetCode and</text><text x="632" y="220" font-size="13" fill="#A9A7CC">GeeksforGeeks.</text><g transform="translate(298,131.0)"><circle r="12" fill="#15162B" stroke="#9A8BFF" stroke-opacity=".7" stroke-width="1.5"/><path d="M-3,-4 L3,0 L-3,4" stroke="#9A8BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(602,131.0)"><circle r="12" fill="#15162B" stroke="#FF8FA3" stroke-opacity=".7" stroke-width="1.5"/><path d="M-3,-4 L3,0 L-3,4" stroke="#FF8FA3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>