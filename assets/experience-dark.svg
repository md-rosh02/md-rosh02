uter Science &amp; Engineering</text><text class="m" x="92" y="260" font-size="12.5" font-weight="600" fill="#B8A9FF">Rural Engineering College, Hulkoti, Gadag</text><text x="92" y="282" font-size="13.5" fill="#8E91AE">Graduated 2025  ·  150+ DSA problems solved on LeetCode and GeeksforGeeks.</text><rect x="780" y="224" width="88" height="24" rx="12" fill="#262749"/><text class="m" x="824.0" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B8A9FF" letter-spacing="1">EDUCATION</text></svg>