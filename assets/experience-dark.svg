ext><text x="328" y="238" font-size="13" fill="#A9A7CC">Built and shipped web interfaces and</text><text x="328" y="257" font-size="13" fill="#A9A7CC">features in a team setting.</text><rect x="752.5" y="38" width="3" height="22" rx="1.5" fill="#4FE3C1" opacity=".6"/><clipPath id="c2"><rect x="608" y="58" width="292" height="246" rx="26"/></clipPath><g clip-path="url(#c2)"><rect x="608" y="58" width="292" height="246" fill="#14152A"/><circle cx="871" cy="70" r="148" fill="#2FD3AE" opacity="0.45" filter="url(#blur)"/><circle cx="637" cy="304" r="98" fill="#FF9E6B" opacity="0.25" filter="url(#blur)"/><rect x="608" y="58" width="292" height="246" fill="url(#dg)"/></g><rect x="608" y="58" width="292" height="246" rx="26" fill="#FFFFFF" fill-opacity="0.045"/><rect x="608.75" y="58.75" width="290.5" height="244.5" rx="25.25" stroke="url(#bd)" stroke-width="1.5"/><rect x="634" y="59" width="240" height="1.2" fill="url(#hl)"/><circle cx="754.0" cy="27" r="17" fill="#14152A" stroke="#4FE3C1" stroke-width="2.5"/><circle cx="754.0" cy="27" r="11" fill="#4FE3C1" fill-opacity=".25"/><text class="m" x="754.0" y="31.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#4FE3C1">03</text><rect x="632" y="80" width="94" height="26" rx="13.0" fill="#4FE3C1" fill-opacity=".14" stroke="#4FE3C1" stroke-opacity=".5"/><text x="679.0" y="97.2" text-anchor="middle" font-size="11" fill="#F5F3FF" font-weight="600">EDUCATION</text><text x="632" y="140" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">B.E. Computer Science</text><text x="632" y="164" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">&amp; Engineering</text><text class="m" x="632" y="194" font-size="12" font-weight="700" fill="#4FE3C1">Rural Engineering College</text><text class="m" x="632" y="212" font-size="12" font-weight="700" fill="#4FE3C1">Hulkoti, Gadag</text><text x="632" y="238" font-size="13" fill="#A9A7CC">Graduated 2025. 150+ DSA problems</text><text x="632" y="257" f