<svg xmlns="http://www.w3.org/2000/svg" width="900" height="22" viewBox="0 0 900 22" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slash{0%{stroke-dashoffset:300;opacity:1}12%{stroke-dashoffset:0;opacity:1}30%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
.ember{animation:ember 5s linear infinite} .pl{animation:pulse 1.6s ease-in-out infinite}
.br{animation:breathe 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.slash{animation:slash 7s ease-out infinite}

</style>
<defs><pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.9" fill="#E5122B" fill-opacity=".55"/></pattern>
<linearGradient id="redg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E5122B"/><stop offset="1" stop-color="#A30B1C"/></linearGradient>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF1F2"/></linearGradient>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#E5122B"/><stop offset="1" stop-color="#E5122B" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="60" y="10.5" width="780" height="1" fill="#E4E2E8"/><polygon points="420.0,6.0 480.0,6.0 472.0,16.0 412.0,16.0" fill="url(#redg)"/></svg>