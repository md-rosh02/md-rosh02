<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slash{0%{stroke-dashoffset:300;opacity:1}12%{stroke-dashoffset:0;opacity:1}30%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
.ember{animation:ember 5s linear infinite} .pl{animation:pulse 1.6s ease-in-out infinite}
.br{animation:breathe 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.slash{animation:slash 7s ease-out infinite}

</style>
<defs><pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.9" fill="#FF3B4E" fill-opacity=".55"/></pattern>
<linearGradient id="redg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3B4E"/><stop offset="1" stop-color="#C1121F"/></linearGradient>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E0E13"/><stop offset="1" stop-color="#1A0B10"/></linearGradient>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#FF3B4E"/><stop offset="1" stop-color="#FF3B4E" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><polygon points="10.0,12.0 20.0,12.0 14.0,48.0 4.0,48.0" fill="url(#redg)"/><polygon points="24.0,12.0 28.0,12.0 22.0,48.0 18.0,48.0" fill="#FF3B4E" opacity=".5"/><text x="40" y="42" font-size="28" font-weight="800" fill="#F3F3F6" letter-spacing="-.7">In Numbers</text><text class="m" x="894" y="40" text-anchor="end" font-size="12" fill="#9C9CAB">a quick snapshot</text><rect x="4" y="57" width="892" height="1.5" fill="url(#ul)" opacity=".7"/></svg>