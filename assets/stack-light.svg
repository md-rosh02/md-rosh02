<svg xmlns="http://www.w3.org/2000/svg" width="900" height="282" viewBox="0 0 900 282" fill="none">
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation:tw 4.4s ease-in-out infinite .8s;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}

</style>
