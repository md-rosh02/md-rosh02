opacity=".5"/><ellipse cx="30" cy="10" rx="7" ry="4.5" fill="#FFFFFF" opacity=".5"/></g><g transform="translate(730,150)"><ellipse cy="46" rx="48" ry="8" fill="#000" opacity=".14"/><g class="sway"><path d="M0,-6 C-6,-40 -34,-52 -40,-80 C-14,-76 0,-44 0,-6Z" fill="url(#lf)"/><path d="M0,-6 C6,-44 30,-60 46,-72 C48,-44 18,-30 0,-6Z" fill="url(#lf)" opacity=".92"/><path d="M0,-6 C-2,-34 2,-60 0,-92 C14,-70 8,-30 0,-6Z" fill="url(#lf)" opacity=".8"/></g><path d="M-38,-6 H38 L30,44 Q29,50 22,50 H-22 Q-29,50 -30,44Z" fill="url(#mg)"/><rect x="-42" y="-14" width="84" height="14" rx="7" fill="url(#mg)"/><circle cx="-11" cy="20" r="3.8" fill="#2A2447"/><circle cx="11" cy="20" r="3.8" fill="#2A2447"/><path d="M-6,29 Q0,35 6,29" stroke="#2A2447" stroke-width="3" stroke-linecap="round"/></g><text x="450" y="104" text-anchor="middle" font-size="34" font-weight="800" fill="url(#tg)" letter-spacing="-.8">Thanks for stopping by</text><text x="450" y="136" text-anchor="middle" font-size="15.5" fill="#6F6A8F">Let's build something lovely together.</text><path class="fl" transform="translate(450,176) scale(1.9)" d="M0,5 C-9,-2 -7,-9 -2.5,-8 C-1,-7.6 0,-6 0,-5 C0,-6 1,-7.6 2.5,-8 C7,-9 9,-2 0,5Z" fill="#F5688B" opacity="1"/><path class="fl2" transform="translate(418,186) scale(1.1)" d="M0,5 C-9,-2 -7,-9 -2.5,-8 C-1,-7.6 0,-6 0,-5 C0,-6 1,-7.6 2.5,-8 C7,-9 9,-2 0,5Z" fill="#7A67F5" opacity="0.9"/><path class="fl2" transform="translate(482,186) scale(1.1)" d="M0,5 C-9,-2 -7,-9 -2.5,-8 C-1,-7.6 0,-6 0,-5 C0,-6 1,-7.6 2.5,-8 C7,-9 9,-2 0,5Z" fill="#0FA383" opacity="0.9"/><path class="fl" d="M323,60 H337 M330,53 V67" stroke="#7A67F5" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/><path class="fl2" d="M584,50 H596 M590,44 V56" stroke="#F28A45" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/><circle class="fl2" cx="300" cy="176" r="5" stroke="#0FA383" stroke-width="2.6" opacity="0.9"/><circle class="fl" cx="612" cy="184" r="5" stroke="#F5688B" stroke-width="2.6" opacity="0.