<svg xmlns="http://www.w3.org/2000/svg" width="440" height="214" viewBox="0 0 440 214" fill="none">
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation:tw 4.4s ease-in-out infinite .8s;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}

</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB4A2"/><stop offset="1" stop-color="#B8A9FF"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="cp"><rect x="1" y="1" width="438" height="212" rx="20"/></clipPath></defs>
<rect x="1" y="1" width="438" height="212" rx="20" fill="#1A1B2B"/>
<g clip-path="url(#cp)"><circle cx="410" cy="10" r="70" fill="#FFB4A2" opacity="0.28" filter="url(#b)"/><rect x="1" y="1" width="438" height="4" fill="url(#g)"/></g>
<rect x="1" y="1" width="438" height="212" rx="20" stroke="#2B2D45" stroke-width="1.5"/>
<rect x="28" y="28" width="46" height="46" rx="14" fill="url(#g)"/>
<text class="m" x="51" y="57" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">TC</text>
<text x="88" y="48" font-size="21" font-weight="800" fill="#EDEDF7" letter-spacing="-.3">ThreadCo</text>
<text class="m" x="88" y="68" font-size="11.5" fill="#FFB4A2" font-weight="600">MERN · FULL STACK</text>
<text x="28" y="108" font-size="13.5" fill="#EDEDF7" opacity=".88">Full-stack web app with a polished React UI</text>
<text x="28" y="130" font-size="13.5" fill="#EDEDF7" opacity=".88">and a REST API backed by MongoDB.</text><rect x="28" y="160" width="59" height="26" rx="13.0" fill="#222440" stroke="#2B2D45"/><text x="57.5" y="177.0" text-anchor="middle" font-size="11.5" fill="#EDEDF7" font-weight="500">React</text><rect x="95" y="160" width="73" height="26" rx="13.0" fill="#222440" stroke="#2B2D45"/><text x="131.5" y="177.0" text-anchor="middle" font-size="11.5" fill="#EDEDF7" font-weight="500">Express</text><rect x="176" y="160" width="73" height="26" rx="13.0" fill="#222440" stroke="#2B2D45"/><text x="212.5" y="177.0" text-anchor="middle" font-size="11.5" fill="#EDEDF7" font-weight="500">MongoDB</text><circle cx="396" cy="174" r="17" fill="#262749" stroke="#2B2D45"/><path d="M390 180 L402 168 M393 168 H402 V177" stroke="#FFB4A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>