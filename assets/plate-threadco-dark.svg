<svg xmlns="http://www.w3.org/2000/svg" width="440" height="188" viewBox="0 0 440 188" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(8deg)}}
.bob{animation:bob 5s ease-in-out infinite}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.st1{animation:steam 3s ease-in-out infinite} .st2{animation:steam 3s ease-in-out infinite .9s} .st3{animation:steam 3s ease-in-out infinite 1.8s}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fl{animation:floaty 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl2{animation:floaty 6.5s ease-in-out infinite 1s;transform-box:fill-box;transform-origin:center}

</style>
<defs><filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9ADFF"/><stop offset=".55" stop-color="#FF9FB2"/><stop offset="1" stop-color="#FFC8A2"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6F8E"/><stop offset="1" stop-color="#FF9E6B"/></linearGradient></defs><clipPath id="c0"><rect x="3" y="3" width="434" height="182" rx="26"/></clipPath><g clip-path="url(#c0)"><rect x="3" y="3" width="434" height="182" fill="#15162B"/><circle cx="394" cy="21" r="109" fill="#FF6F8E" opacity="0.45" filter="url(#blur)"/><circle cx="25" cy="185" r="73" fill="#FF9E6B" opacity="0.30" filter="url(#blur)"/></g><rect x="3" y="3" width="434" height="182" rx="26" fill="#FFFFFF" fill-opacity="0.04"/><rect x="3.75" y="3.75" width="432.5" height="180.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1.5"/><rect x="26" y="24" width="52" height="52" rx="17" fill="url(#bg)"/><text class="m" x="52.0" y="55.5" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">TC</text><text x="92" y="48" font-size="22" font-weight="800" fill="#F5F3FF" letter-spacing="-.4">ThreadCo</text><text class="m" x="93" y="68" font-size="11.5" font-weight="700" fill="#FF8FA3" letter-spacing=".8">MERN  ·  FULL STACK</text><g transform="translate(396,44)"><circle r="16" fill="#FF8FA3" fill-opacity=".14" stroke="#FF8FA3" stroke-opacity=".55"/><path d="M-5.5 5.5 L5.5 -5.5 M-4.5 -5.5 H5.5 V4.5" stroke="#FF8FA3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="104" font-size="14" fill="#F5F3FF" opacity=".92">Full-stack web app with a polished React</text><text x="28" y="126" font-size="14" fill="#F5F3FF" opacity=".92">UI and a REST API backed by MongoDB.</text><rect x="28" y="142" width="64" height="28" rx="14.0" fill="#FF8FA3" fill-opacity=".14" stroke="#FF8FA3" stroke-opacity=".5"/><text x="60.0" y="160.2" text-anchor="middle" font-size="12" fill="#F5F3FF" font-weight="600">React</text><rect x="100" y="142" width="79" height="28" rx="14.0" fill="#FF8FA3" fill-opacity=".14" stroke="#FF8FA3" stroke-opacity=".5"/><text x="139.5" y="160.2" text-anchor="middle" font-size="12" fill="#F5F3FF" font-weight="600">Express</text><rect x="187" y="142" width="79" height="28" rx="14.0" fill="#FF8FA3" fill-opacity=".14" stroke="#FF8FA3" stroke-opacity=".5"/><text x="226.5" y="160.2" text-anchor="middle" font-size="12" fill="#F5F3FF" font-weight="600">MongoDB</text></svg>